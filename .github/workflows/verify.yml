name: Verificar entrega 2
on: [push, pull_request]
jobs:
  sistema-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Arrancar y verificar Go, MySQL, contratos y navegador
        run: sh scripts/verify.sh
      - name: Conservar evidencia e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e
          path: docs/evidence/entrega2/e2e
      - name: Detener servicios
        if: always()
        run: docker compose down
