services:
  mock:
    build:
      context: .
      dockerfile: mock/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  verificar:
    profiles: ["verificar"]
    build:
      context: .
      dockerfile: mock/Dockerfile
    command: ["python", "-m", "unittest", "discover", "-s", "mock", "-p", "test_*.py", "-v"]
  usuarios:
    profiles: ["estructura"]
    build: ./services/usuarios
    ports: ["127.0.0.1:8101:8080"]
  electrodomesticos:
    profiles: ["estructura"]
    build: ./services/electrodomesticos
    ports: ["127.0.0.1:8102:8080"]
  consumo:
    profiles: ["estructura"]
    build: ./services/consumo
    ports: ["127.0.0.1:8103:8080"]
  solar:
    profiles: ["estructura"]
    build: ./services/solar
    ports: ["127.0.0.1:8104:8080"]
  gateway:
    profiles: ["estructura"]
    build: ./gateway
    ports: ["127.0.0.1:8105:8080"]
